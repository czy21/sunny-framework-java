name: Build

on:
  push:
    branches: 
      - main
      - boot-*

jobs:
  build:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v6
      - run: |
          export JAVA_HOME="/usr/local/java/graalvm-community-openjdk-25"
          export NODEJS_HOME="/volume1/app/nvm/versions/node/v24.20.0"
          export PATH="$PATH:$JAVA_HOME/bin:$NODEJS_HOME/bin"
          chmod +x ./gradlew
          ./gradlew clean
          ./gradlew publishToMavenLocal publishAllPublicationsToHomeSnapshotsRepository