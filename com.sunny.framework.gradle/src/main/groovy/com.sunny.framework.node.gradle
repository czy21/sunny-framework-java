tasks.named('npmInstall', NpmTask) {
    environment = [
    ]
}

tasks.named('pnpmInstall', PnpmTask) {
    environment = [
            'pnpm_config_registry': providers.gradleProperty('param_npm_repo').getOrElse(System.getenv('param_npm_repo'))
    ]
}

tasks.register('clean', Delete) {
    group 'build'
    delete 'build'
}

tasks.register('build', NpmTask) {
    group 'build'
    dependsOn { project.file('pnpm-lock.yaml').exists() ? 'pnpmInstall' : 'npmInstall' }
    args = ['run', 'build']
}
